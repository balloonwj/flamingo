; NOTE: keep everything you type here pure ASCII, and do NOT edit this file with a
; UTF-8 editor. Values are read through the Win32 profile API, which treats a file
; without a UTF-16 BOM as ANSI, so UTF-8 bytes typed by hand come back garbled.
; Localized values written by the program itself (e.g. [storage] datapath, which may
; contain Chinese) are fine: the program writes and reads them through the same API,
; so they round-trip correctly. Put localized UI strings in Source/UIText.h
; (UTF-8 with BOM) and let the built-in defaults apply instead.
[server]
server=127.0.0.1
port=20000
fileserver=127.0.0.1
fileport=20001
imgserver=127.0.0.1
imgport=20002
proxytype=0
proxyserver=eee
proxyport=12
heartbeatinterval=5
enablereconnect=1
reconnectinterval=5000
; serverpubkey: base64 of the server's 32-byte Ed25519 identity public key, copied
; verbatim from flamingoserver/etc/server_key.pub on the server. It is what makes a
; man-in-the-middle impossible: only the real server holds the matching private key,
; so only it can pass the signature check during the handshake.
;
; There is deliberately NO separate on/off switch for encryption on the client. This
; key IS the switch: set it and every connection does the three-frame handshake and
; encrypts from then on; leave it empty and every connection stays plaintext. That
; pairs one-to-one with the server's own 'encryption' setting in chatserver.conf,
; so a mismatch always has one obvious cause instead of two switches to cross-check.
;
; All four links (chat 20000, file 20001, image 20002, relay 20003) use this one key,
; because all three server processes share one identity key file.
;
; If the server regenerates its key (its server_key file was deleted), every client
; must be given the new value here, otherwise the handshake fails and nothing connects.
serverpubkey=QLcjYOULvHX+dgwbRRvlwg0dwNRnO2H6D9a/u+7KZEg=
tls=0
imgtls=0
filetls=0
[app]
; clearexpirelog: 1 = on startup delete every log file in the Logs directory,
; keeping only the one this run writes (that one is locked by this process, so
; it survives); 0 = keep them all. Despite the name there is no age check - it
; clears the whole history, not just the old entries.
;
; The key is deliberately absent here so the built-in default applies: off in
; Debug builds (developers need the previous runs' logs), on in Release builds
; (nobody prunes the directory by hand on a user machine). Toggling the switch
; in Settings -> Storage writes an explicit 0 or 1 back to this file, and from
; then on the explicit value wins. See Source/LogCleanupPolicy.h.
;
; autodownloadupdate: 0 = only check for a new client version after login and
; write the result to the log; 1 = also download the package right away.
; Keep it 0 in production - pulling tens of MB silently behind the user is rude;
; the upgrade window asks first. Set it to 1 to exercise the download path.
autodownloadupdate=1
loglevel=0
; foldermaxconcurrent: how many folder transfers this client may run at the same
; time; sending one folder and receiving one folder each count as one. Default 5,
; valid range 1..16 - a missing, non-numeric or out-of-range value falls back to 5
; and writes one warning line to the log. The client checks this before the invite
; leaves the machine so the user gets an immediate message instead of a rejection
; from the server; the server keeps its own per-user limit (foldermaxperuser in
; chatserver.conf) and stays authoritative. Raising it here does not raise the
; server limit, so keep the two in step.
foldermaxconcurrent=5
[ui]
apptitle=Flamingo IM
copyrighttext=Flamingo IM 2017-2024
companyurllink=
mywebsitelink=
;about dialog: official website link
websiteurl=
[client]
deviceid=PC-64E62A75511A463781A029262ADBE949
[chat]
sendmsgkey=enter
