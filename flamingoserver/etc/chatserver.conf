#client listener
listenip=0.0.0.0
listenport=20000

#monitor listener
monitorlistenip=0.0.0.0
monitorlistenport=18889
monitortoken=123

#http listener
httplistenip=0.0.0.0
httplistenport=12345

#logfiledir: directory the log files are written to. A relative path is resolved
#against the directory the chatserver executable lives in - NOT the process working
#directory - so the logs always land in the same place no matter where the server is
#started from. This is the same rule as dbpath and as the lookup of this config file.
#An absolute path (X:\..., /var/...) is used as written. The directory is created on
#startup if it does not exist yet.
#logfilename: base name of the log file. The server appends timestamp, pid and ".log".
logfiledir=logs/
logfilename=chatserver
logbinarypackage=0

#database config
#dbtype: which database backend to use.
#  mysql  - remote MySQL/MariaDB (default; keeps existing deployments unchanged)
#  sqlite - local single-file SQLite database, no separate database service needed
#If this key is absent the server falls back to mysql, so old config files keep working.
dbtype=sqlite

#mysql config, used only when dbtype=mysql
dbserver=127.0.0.1
dbuser=root
dbpassword=123456
dbname=flamingo

#sqlite config, used only when dbtype=sqlite
#dbpath: database file path. A relative path is resolved against the directory the
#chatserver executable lives in - NOT the process working directory - so the server
#always opens the same database no matter where it is started from.
#An absolute path (X:\..., /var/..., \\server\share\...) is used as written.
#The file and its parent directories are created automatically on first run.
dbpath=data/flamingo.db

#default super admin bootstrap
#On startup chatserver checks whether t_admin holds any platform super admin
#(a row with f_enterprise_id = 0). If there is none, it creates the account below,
#so that a freshly deployed database still has an account able to log into the
#admin console. If one already exists, nothing is created and nothing is overwritten
#- changing the password from the console will not be reverted by a restart.
#defaultadminenable: 1 = create when missing (default when this key is absent), 0 = never touch the database.
#SECURITY: the password below is public in the source repository.
#Change it here before any real deployment, or set defaultadminenable=0.
#WARNING: '#' starts a comment anywhere on a line (see base/ConfigFileReader.cpp),
#so a password containing '#' is silently truncated at that character - the account
#would be created with a shorter password than the one written here, and logging in
#with the full string would fail. Do not use '#' in defaultadminpassword.
defaultadminenable=1
defaultadminemail=admin@flamingo.com
defaultadminpassword=admin123
#defaultadminname: display name of the account. Left out on purpose - this file is
#kept pure ASCII like the other .conf files, and omitting the key makes the server
#use its built-in default. Set it only if your editor saves this file as UTF-8,
#otherwise the name lands in the database as mojibake.
#defaultadminname=

#file/image transfer config
#filetokenkey: HMAC key for upload/download tokens; must match fileserver.conf / imgserver.conf
filetokenkey=flamingo-file-token-secret
#relaytokenkey: HMAC key for remote-desktop relay tokens; must match imgserver.conf
relaytokenkey=flamingo-relay-token-secret
#address chatserver tells clients to connect for image upload/download (avatar / image message)
imgserverhost=127.0.0.1
imgserverport=20002
#relayport: remote-desktop relay channel port on the imgserver host (must match imgserver.conf relaylistenport); host reuses imgserverhost
relayport=20003
#address chatserver tells clients to connect for file upload/download (chat file / group file)
fileserverhost=127.0.0.1
fileserverport=20001

#updatecachedir: same directory as updatecachedir in fileserver.conf. chatserver
#only READS it, to list candidate packages for the admin console; it never writes
#files there. Resolved against the executable directory.
updatecachedir=./updatecache/
