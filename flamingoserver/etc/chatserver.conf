#client listener
listenip=0.0.0.0
listenport=20000

#monitor listener
monitorlistenip=0.0.0.0
monitorlistenport=18889
monitortoken=123

#http listener
httplistenip=0.0.0.0
httplistenport=12345

logfiledir=logs/
logfilename=chatserver
logbinarypackage=0

#database config
#dbtype: which database backend to use.
#  mysql  - remote MySQL/MariaDB (default; keeps existing deployments unchanged)
#  sqlite - local single-file SQLite database, no separate database service needed
#If this key is absent the server falls back to mysql, so old config files keep working.
dbtype=sqlite

#mysql config, used only when dbtype=mysql
dbserver=127.0.0.1
dbuser=root
dbpassword=123456
dbname=flamingo

#sqlite config, used only when dbtype=sqlite
#dbpath: database file path, relative to the process working directory.
#The file and its parent directories are created automatically on first run.
dbpath=data/flamingo.db

#file/image transfer config
#filetokenkey: HMAC key for upload/download tokens; must match fileserver.conf / imgserver.conf
filetokenkey=flamingo-file-token-secret
#relaytokenkey: HMAC key for remote-desktop relay tokens; must match imgserver.conf
relaytokenkey=flamingo-relay-token-secret
#address chatserver tells clients to connect for image upload/download (avatar / image message)
imgserverhost=127.0.0.1
imgserverport=20002
#relayport: remote-desktop relay channel port on the imgserver host (must match imgserver.conf relaylistenport); host reuses imgserverhost
relayport=20003
#address chatserver tells clients to connect for file upload/download (chat file / group file)
fileserverhost=127.0.0.1
fileserverport=20001