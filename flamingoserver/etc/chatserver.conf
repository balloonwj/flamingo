#客户端监听地址与端口
listenip=0.0.0.0
listenport=20000

#监控端口，供 telnet 上来敲 help / ul / su 等命令
monitorlistenip=0.0.0.0
monitorlistenport=18889
monitortoken=123

#HTTP 短连接端口，admin 控制台走这里
httplistenip=0.0.0.0
httplistenport=12345

#管理控制台长连接端口（flamingoAdmin 的 FlamingoLink.dll，用来实时查看企业在线用户，docs/FlamingoLink方案.md）。
#三项都可缺失：adminlinklistenport 缺失或为 0 时不开启，控制台的「在线用户」页会提示服务器未开启；
#adminlinklistenip 缺失时监听所有网卡，可只填内网地址；adminlinkiothreadnum 缺失时为 1。
#加密沿用下文的 encryption 与 serverkeyfile；端口号与服务端公钥由 /admin/login.do 下发给控制台。
#部署在 NAT 或云安全组之后时，要放通这个 TCP 端口。
adminlinklistenip=0.0.0.0
adminlinklistenport=20006
adminlinkiothreadnum=1

#网络 I/O 工作线程数
#上面三个监听端口各配一项，单位：条线程。服务把这个数交给 TcpServer，由它建出同样条数的
#I/O 工作线程，该端口上所有连接的收发都摊在这些线程上。
#这一组都可以整项省略，省略时按下面各项注释里写的默认值运行 —— 默认值就是本组配置项
#引入之前写死在代码里的那几个数，所以老配置文件不改也能启动，且行为完全不变。
#取值必须是 1 到 256 之间的十进制整数。取值非法时一律回落到默认值并在日志里记一条
#告警，告警里同时写出配置的值与实际采用的值。非法包括：整项缺失、不是十进制整数
#（如 abc、4x、1.5）、0、负数、以及大于 256。
#注意是回落到默认值而不是截断到边界 —— 截断之后实际生效的线程数与这里写的对不上，
#而排查问题的人手上往往只有这个文件，据此会得出错误的结论。
#上界取 256 的依据：Windows 上事件循环用的是 select，每条线程最多盯 64 条连接，
#线程数超过几十条之后再往上加已无实际意义；定这个上界主要是挡住「把端口号或字节数
#误填进线程数」这类笔误，那类值动辄上万，真按它建线程会让服务在启动阶段就耗光资源。
#iothreadnum：客户端连接（上面的 listenport）所用的线程数，默认 6
iothreadnum=6
#monitoriothreadnum：监控端口（monitorlistenport）所用的线程数，默认 1。
#该端口同时只有零星几条 telnet 连接，一条线程足够
monitoriothreadnum=1
#httpiothreadnum：HTTP 短连接端口（httplistenport）所用的线程数，默认 4
httpiothreadnum=4

#logfiledir：日志文件所在目录。相对路径按 chatserver 可执行文件所在目录解析，
#不是按进程的工作目录，所以无论从哪里启动，日志都落在同一处。
#这条规则与 dbpath 以及本配置文件自身的查找规则一致。
#绝对路径（X:\...、/var/...）原样使用。目录不存在时启动阶段会自动创建。
#logfilename：日志文件的基名，服务端会在其后追加时间戳、进程号与 ".log"。
logfiledir=logs/
logfilename=chatserver
#是否把收发的数据包按二进制形式打进日志，排查协议问题时才打开
logbinarypackage=0

#数据库配置
#dbtype：使用哪种数据库后端。
#  mysql  - 远程 MySQL / MariaDB（默认值，保证老部署行为不变）
#  sqlite - 本地单文件 SQLite 数据库，不需要另外部署数据库服务
#这一项缺失时按 mysql 处理，所以老的配置文件不改也能继续用。
dbtype=sqlite

#MySQL 的连接参数，只有 dbtype=mysql 时才用得上
dbserver=127.0.0.1
dbuser=root
dbpassword=123456
dbname=flamingo

#SQLite 的参数，只有 dbtype=sqlite 时才用得上
#dbpath：数据库文件路径。相对路径按 chatserver 可执行文件所在目录解析，
#不是按进程的工作目录，这样无论从哪里启动，打开的都是同一个库。
#绝对路径（X:\...、/var/...、\\服务器\共享\...）原样使用。
#首次运行时会自动创建该文件及其上级目录。
dbpath=data/flamingo.db

#dbconnpool：是否启用数据库连接池，1 启用，0 关闭；缺失时按启用处理。
#启用后，用完的数据库连接暂存起来，供下一次访问数据库直接使用，省掉每次新建连接的开销
#（MySQL 走 TLS 时实测每条连接 40~90 毫秒；SQLite 每次打开并解析库结构实测 15 毫秒左右；复用都只需不到 1 毫秒）。
#两种后端的空闲连接都在 10 分钟没有被使用后关闭。MySQL 的空闲连接另外每 60 秒左右 ping 一次保活，
#空闲超过 5 秒的连接在取用前先 ping 确认可用；SQLite 是进程内库，不需要保活。
dbconnpool=1

#默认超级管理员的引导
#chatserver 启动时会检查 t_admin 里有没有平台超级管理员（f_enterprise_id = 0 的记录）。
#一个都没有时就按下面几项建一个，使全新部署的库也有账号能登进 admin 控制台。
#已经存在时既不新建也不覆盖，在控制台里改过的口令不会被重启还原。
#defaultadminenable：1 = 没有时才创建（这一项缺失时也按 1 处理），0 = 完全不碰数据库。
#安全提醒：下面这个口令是公开写在源码仓库里的，正式部署前务必改掉，
#或者把 defaultadminenable 置 0。
#注意：本解析器把一行里任何位置的 '#' 都当作注释起点（见 base/ConfigFileReader.cpp），
#所以口令里含 '#' 会被从该字符处悄悄截断 —— 建出来的账号口令比这里写的短，
#拿完整口令反而登不进去。defaultadminpassword 里不要出现 '#'。
defaultadminenable=1
defaultadminemail=admin@flamingo.com
defaultadminpassword=admin123
#defaultadminname：该账号的显示名。这一项留着不填，服务端会用内置的默认值。
#要填中文显示名，须保证本文件以 UTF-8 保存（当前就是 UTF-8），
#用 GBK 一类的编码保存会让名字以乱码写进数据库。
#defaultadminname=

#文件与图片传输相关
#filetokenkey：上传 / 下载令牌的 HMAC 密钥，须与 fileserver.conf、imgserver.conf 一致
filetokenkey=flamingo-file-token-secret
#relaytokenkey：远程桌面中转令牌的 HMAC 密钥，须与 imgserver.conf 一致
relaytokenkey=flamingo-relay-token-secret
#chatserver 告诉客户端去哪里上传 / 下载图片（头像与图片消息）
imgserverhost=127.0.0.1
imgserverport=20002
#relayport：远程桌面中转通道在 imgserver 那台机器上的端口，
#须与 imgserver.conf 的 relaylistenport 一致；主机地址复用上面的 imgserverhost
relayport=20003

#云端录制（屏幕共享的服务器录制，见 docs/屏幕共享与录制方案.md 12.6）：chatserver 用上面的 relayport 与 relaytokenkey
#主动连 imgserver 建控制连接。cloudrecordhost：imgserver 供服务器之间连接的地址，缺失时用 imgserverhost
#（imgserverhost 是下发给客户端的地址，两台服务之间走内网时在这里另填内网地址）
#cloudrecordhost=127.0.0.1
#chatserver 告诉客户端去哪里上传 / 下载文件（聊天文件与群文件）
fileserverhost=127.0.0.1
fileserverport=20001

#单聊文件夹传输（cmd_folder_* 1810~1817）
#这一组都可以整项省略，省略时按下面注释里写的默认值运行，老配置文件不改也能启动。
#中转地址不在这里配：文件夹的字节走 fileserver 现有的监听端口，chatserver 下发给客户端的
#就是上面的 fileserverhost / fileserverport；令牌密钥也不另配，复用上面的 relaytokenkey。
#foldermaxfiles：单次文件夹传输的文件数上限，单位：个。超限时 chatserver 拒绝这次邀请，
#应答里回带本值供客户端提示（客户端不得硬编码上限）。默认 10000。
foldermaxfiles=10000
#foldermaxsize：单次文件夹传输的总字节数上限，单位：字节。超限时同样拒绝并回带本值。
#默认 53687091200，即 50 GiB。
foldermaxsize=53687091200
#folderlanes：数据通道条数，单位：条，不含 lane 0 那条控制通道；客户端据此共建 lanes+1
#条到 fileserver 的连接。硬上限 8，写大了按 8 截断并记一条告警日志；写成 0 或负数按默认值。
#默认 4：一次传输在服务端占用 2 × (lanes + 1) 条连接，再多则收益迅速变平，
#而接收端并行写多个文件在机械硬盘上会退化成随机写。
folderlanes=4
#foldermaxsessions：整台服务器同时进行的文件夹传输会话数上限，单位：个。达到上限后新的
#邀请一律被拒（错误码 619），绝不能让连接连上之后静默卡死。
#这个闸门在 Windows 上是必需的：那里 EventLoop 用的是 SelectPoller，每个 I/O 线程最多盯
#FD_SETSIZE（默认 64）条连接，超出时 winsock 的 FD_SET 会静默丢弃，表现为传输凭空卡住且
#日志里毫无线索。故 Windows 部署建议 24，Linux（epoll，无此限制）建议 128。
#下面写的是 Windows 的建议值，即较保守的那一侧；部署到 Linux 时可以调到 128。
#估算这个值时要按下面的 foldermaxperuser 算：单个用户最多可同时参与 5 笔传输，
#而一笔传输在服务端占用 2 × (folderlanes + 1) 条连接，即默认配置下每笔 10 条、
#单个用户满额时 50 条。也就是说 24 这个总数在最坏情况下只够 5 个用户各自满额。
foldermaxsessions=24
#foldermaxperuser：每个用户同时可参与的文件夹传输笔数，单位：笔。发送与接收各算一笔
#（给别人发 3 个文件夹、同时收别人 2 个文件夹，就是 5 笔、正好满额）；失败待重试的会话
#在 folderretrywindow 保留期内仍占名额。任一方满额时新邀请被拒（错误码 620）。默认 5。
foldermaxperuser=5
#folderinvitetimeout：邀请发出后等待接收方应答的超时，单位：毫秒。超时后服务端结束会话
#并向双方推一帧状态变更（已超时）。默认 1800000，即 30 分钟 —— 接收方常常只是暂时离开
#座位，超时过短会让邀请在对方回到座位前就被作废。发送方随时可以主动撤回（cmd_folder_cancel），
#不必等超时，故把这个值放长的代价很小。
folderinvitetimeout=1800000
#folderretrywindow：传输失败后会话的保留时长，单位：毫秒。期内发送方可以点「重试」直接
#断点续传、不再打扰接收方；期满会话销毁，只能重新发起一次完整传输。默认 600000，即 10 分钟。
folderretrywindow=600000
#单聊单文件 P2P 直传（文件消息在双方都在线时经 P2P 直接发给对方，复用上面这组信令，2026-10-04 起）
#directfileinvitetimeout：直传邀请等待接收方应答的超时，单位：毫秒。超时后发送方自动改为上传服务器
#发离线文件。默认 300000，即 5 分钟。
directfileinvitetimeout=300000
#directfilemaxperuser：每个用户同时可参与的直传笔数，单位：笔，发送与接收各算一笔。直传不经 fileserver
#中转，不占上面的 foldermaxsessions / foldermaxperuser 名额。满额时新邀请被拒（错误码 620），发送方
#改为上传服务器。默认 10。
directfilemaxperuser=10

#文件共享（cmd_share_* 2201~2230，方案见 docs/文件共享方案.md 6.4）
#sharemaxpershareowner：每人同时持有的有效共享数上限，单位：个。达到上限后再发起共享回错误码 815，
#取消一个之后才能再发起。缺失时取默认值 20。
sharemaxpershareowner=20
#文件共享的字节与文件夹传输一样走 fileserver 的中转端口，令牌密钥与中转地址复用上面的
#relaytokenkey、fileserverhost、fileserverport，不另外配置。
#sharelanes：一次传输（传输子会话）的数据通道条数，单位：条，不含 lane 0 控制通道，硬上限 4。
#一个传输子会话在 fileserver 上占 2 × (sharelanes + 1) 条连接。默认 2。
sharelanes=2
#sharemaxaccess：整台服务器同时存在的访问会话（打开着的浏览窗口）数上限，单位：个。一个访问会话
#在 fileserver 上占 2 条连接。达到上限后再打开共享回错误码 814。Windows 上 fileserver 用 select，
#每个 I/O 线程至多 64 条连接，默认 30；Linux 用 epoll，默认 1000。下面写的是 Windows 的取值。
sharemaxaccess=30
#sharemaxtransfers：整台服务器同时进行的传输数上限，单位：个。达到上限后再申请传输回错误码 814。
#Windows 默认 12，Linux 默认 256。下面写的是 Windows 的取值。
sharemaxtransfers=12
#sharemaxtransferpershare：每个共享同时在传输的人数上限，单位：人。达到上限后回错误码 813。默认 5。
sharemaxtransferpershare=5
#shareopentimeout：访问者打开共享后等待分享者应答的超时，单位：毫秒，随中转参数下发给访问者。默认 15000。
shareopentimeout=15000
#shareidletimeout：访问会话没有任何请求时自动回收连接的时长，单位：毫秒，随中转参数下发。默认 600000，即 10 分钟。
shareidletimeout=600000
#sharesearchmaxresults：一次搜索最多返回的条数，单位：条，下发给分享者执行。默认 500。
sharesearchmaxresults=500
#sharesearchtimeout：一次搜索的最长耗时，单位：毫秒，下发给分享者执行。默认 10000。
sharesearchtimeout=10000

#updatecachedir：客户端升级包目录，须与 fileserver.conf 里的 updatecachedir 指向同一个目录。
#chatserver 对它只读，用来给 admin 控制台列出候选升级包，不会往里写文件。
#按可执行文件所在目录解析。
updatecachedir=./updatecache/

#协议加密
#encryption：1 = 三帧握手之后每个帧体都加密（默认），0 = 明文。
#这一项缺失时按 1 处理：安全开关必须往安全的方向失败，
#否则少写一行就把链路悄悄降成了明文。
#serverkeyfile：长期 Ed25519 身份密钥种子文件的路径。相对路径按
#「本配置文件所在的目录」解析（通常就是 etc/），这与 logfiledir、dbpath 的规则不同 ——
#那两项按可执行文件所在目录解析。这里的差异是有意为之：三个服务读的是同一个 etc/
#目录下的 .conf，按这条规则它们天然就落在同一个密钥文件上，不需要额外约定。
#该文件在首次启动时自动创建，同时在旁边生成 <serverkeyfile>.pub，里面是 base64 编码的
#公钥。把这个公钥填进客户端的 config/flamingo.ini 的 serverpubkey 项。
#三个服务（chatserver / fileserver / imgserver）必须指向同一个文件，
#否则客户端要为每个服务各配一把公钥。
#安全提醒：种子文件是服务端的私有身份，不要提交进版本库，权限只给服务账号。
#删掉它会让服务端在下次启动时生成新的身份，届时所有客户端都得换用新公钥。
#另外注意：本解析器只认 '#' 作注释（见 base/ConfigFileReader.cpp），
#以 ';' 开头的行并不是注释，只是因为它不含 '=' 才碰巧被跳过。
encryption=1
serverkeyfile=server_key

#P2P 信令（docs/P2P通信方案.md 9.3，客户端之间的点对点直连）
#回落中转复用上面的 relaytokenkey、imgserverhost、relayport，不另外配置。以下各项都可缺失，
#缺失或写成非法值（非数字、小于等于 0）时取默认值。是否启用按企业设置（flamingoAdmin 的功能开关 p2p.enabled），不在这里配置。
#p2pprobehost：下发给客户端的地址探测服务器地址，缺失时取 imgserverhost。
#p2pprobeport1 / p2pprobeport2：imgserver 上的两个 UDP 地址探测端口，须与 imgserver.conf 一致；配成 0 表示不下发这个端口。
#p2pconnecttimeoutms：打洞超时（毫秒），超时后改走中转。p2pkeepalivems：链路空闲时的保活间隔（毫秒）。
#p2plinktimeoutms：多久收不到对端的报文就判定链路断开（毫秒）。p2pmaxperuser：每人同时进行的 P2P 会话上限。
#p2pdebugopen：1 = 受理联调用的 2306（客户端直接对某人建 P2P 会话），生产环境保持 0。
p2pprobeport1=20004
p2pprobeport2=20005
p2pconnecttimeoutms=3000
p2pkeepalivems=5000
p2plinktimeoutms=15000
p2pmaxperuser=16
p2pdebugopen=0

#默认企业的全称：chatserver 每次启动时保证库里有这家企业（不存在则建出来，状态为活跃，并建好
#公司根部门）。PC 客户端注册窗「公司名称」的默认项取自客户端 config/flamingo.ini 的
#[ui] defaultcompany，两边须配成同一个值，否则用户不改默认名直接注册时会提示公司不存在。
#可以写中文，本文件须保存为 UTF-8。没有这一项或值为空白时为 FlamingoIM.org。
#改名不会改动已建出的企业：原来那家企业仍然保留，启动时会按新名称再建一家。
defaultenterprise=FlamingoIM.org
