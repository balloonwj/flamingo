listenip=0.0.0.0
listenport=20001

filecachedir=./filecache/
#logfiledir: directory the log files are written to. A relative path is resolved
#against the directory the fileserver executable lives in - NOT the process working
#directory - so the logs always land in the same place no matter where the server is
#started from. This is the same rule as the lookup of this config file itself.
#An absolute path (X:\..., /var/...) is used as written. The directory is created on
#startup if it does not exist yet.
#logfilename: base name of the log file. The server appends timestamp, pid and ".log".
logfiledir=logs/
logfilename=fileserver

#filetokenkey: HMAC key for verifying upload/download tokens; must match chatserver.conf
filetokenkey=flamingo-file-token-secret

#updatecachedir: directory holding client upgrade packages, kept separate from
#filecachedir so that upgrade packages do not mix with chat files. Operators drop
#the zip here under any human readable name; fileserver locates it by content MD5
#through UpdatePackageIndex. Resolved against the executable directory (like
#chatserver's dbpath), NOT the working directory. Must point at the same directory
#as updatecachedir in chatserver.conf. If omitted, falls back to filecachedir.
updatecachedir=./updatecache/
