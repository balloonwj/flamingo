#客户端监听地址与端口
listenip=0.0.0.0
listenport=20001

#iothreadnum：网络 I/O 工作线程数，单位：条线程。服务把这个数交给 TcpServer，由它建出
#同样条数的 I/O 工作线程，上面那个监听端口上所有上传下载连接的收发都摊在这些线程上。
#可以整项省略，省略时按默认值 6 运行 —— 6 就是本配置项引入之前写死在代码里的那个数，
#所以老配置文件不改也能启动，且行为完全不变。
#取值必须是 1 到 256 之间的十进制整数。取值非法时一律回落到默认值并在日志里记一条
#告警，告警里同时写出配置的值与实际采用的值。非法包括：整项缺失、不是十进制整数
#（如 abc、4x、1.5）、0、负数、以及大于 256。
#注意是回落到默认值而不是截断到边界 —— 截断之后实际生效的线程数与这里写的对不上，
#而排查问题的人手上往往只有这个文件，据此会得出错误的结论。
#上界取 256 的依据：Windows 上事件循环用的是 select，每条线程最多盯 64 条连接，
#线程数超过几十条之后再往上加已无实际意义；定这个上界主要是挡住「把端口号或字节数
#误填进线程数」这类笔误，那类值动辄上万，真按它建线程会让服务在启动阶段就耗光资源。
#另外注意：fileserver 与 imgserver 共用同一份服务端代码，但线程数各读各的配置文件，
#这里配的只管 fileserver，imgserver 要在它自己的 imgserver.conf 里另配一份。
iothreadnum=6

#聊天文件与群文件的落盘目录
filecachedir=./filecache/

#logfiledir：日志文件所在目录。相对路径按 fileserver 可执行文件所在目录解析，
#不是按进程的工作目录，所以无论从哪里启动，日志都落在同一处。
#这条规则与本配置文件自身的查找规则一致。
#绝对路径（X:\...、/var/...）原样使用。目录不存在时启动阶段会自动创建。
#logfilename：日志文件的基名，服务端会在其后追加时间戳、进程号与 ".log"。
logfiledir=logs/
logfilename=fileserver

#filetokenkey：校验上传 / 下载令牌的 HMAC 密钥，须与 chatserver.conf 一致
filetokenkey=flamingo-file-token-secret

#relaytokenkey：校验单聊文件夹传输中转令牌的 HMAC 密钥，须与 chatserver.conf 的同名项一致。
#单聊「发送文件夹」的文件字节走 fileserver 中转（信令走 chatserver），中转令牌由 chatserver
#在接收端同意之后签发、由本服务本地验签，两边用的是同一把密钥，配不一致则所有中转握手都验签失败。
#中转不新开端口，就在上面那个 listenport 上按帧 cmd 分流（cmd_folder_relay_hello / _data）。
#这一项缺失时本服务照常提供上传下载，只是不承载文件夹中转：中转握手一律被拒，并在启动日志里
#留一条说明。协议与设计见 docs/协议设计-v2.md 第 12 章、docs/单聊文件夹传输方案.md。
relaytokenkey=flamingo-relay-token-secret

#updatecachedir：存放客户端升级包的目录，与 filecachedir 分开放，
#免得升级包和聊天文件混在一起。运维把 zip 放进来时文件名随便起，
#fileserver 通过 UpdatePackageIndex 按文件内容的 MD5 反查。
#按可执行文件所在目录解析（与 chatserver 的 dbpath 一样），不是按工作目录。
#必须与 chatserver.conf 里的 updatecachedir 指向同一个目录。
#这一项缺失时回落到 filecachedir。
updatecachedir=./updatecache/

#协议加密
#encryption：1 = 三帧握手之后每个帧体都加密（默认），0 = 明文。
#这一项缺失时按 1 处理：安全开关必须往安全的方向失败，
#否则少写一行就把链路悄悄降成了明文。
#serverkeyfile：长期 Ed25519 身份密钥种子文件的路径。相对路径按
#「本配置文件所在的目录」解析（通常就是 etc/），这与 logfiledir 的规则不同 ——
#后者按可执行文件所在目录解析。这里的差异是有意为之：三个服务读的是同一个 etc/
#目录下的 .conf，按这条规则它们天然就落在同一个密钥文件上，不需要额外约定。
#该文件在首次启动时自动创建，同时在旁边生成 <serverkeyfile>.pub，里面是 base64 编码的
#公钥。把这个公钥填进客户端的 config/flamingo.ini 的 serverpubkey 项。
#三个服务（chatserver / fileserver / imgserver）必须指向同一个文件，
#否则客户端要为每个服务各配一把公钥。
#安全提醒：种子文件是服务端的私有身份，不要提交进版本库，权限只给服务账号。
#删掉它会让服务端在下次启动时生成新的身份，届时所有客户端都得换用新公钥。
#另外注意：本解析器只认 '#' 作注释（见 base/ConfigFileReader.cpp），
#以 ';' 开头的行并不是注释，只是因为它不含 '=' 才碰巧被跳过。
encryption=1
serverkeyfile=server_key
