listenip=0.0.0.0
listenport=20002

imgcachedir=./imgcache/
logfiledir=logs/
logfilename=imgserver

#filetokenkey: HMAC key for verifying upload/download tokens; must match chatserver.conf
filetokenkey=flamingo-file-token-secret
#relaytokenkey: HMAC key for verifying remote-desktop relay tokens; must match chatserver.conf
relaytokenkey=flamingo-relay-token-secret
#relaylistenip/relaylistenport: remote-desktop relay channel listener (independent from the image port above)
relaylistenip=0.0.0.0
relaylistenport=20003