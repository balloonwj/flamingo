listenip=0.0.0.0
listenport=20002

imgcachedir=./imgcache/
#logfiledir: directory the log files are written to. A relative path is resolved
#against the directory the imgserver executable lives in - NOT the process working
#directory - so the logs always land in the same place no matter where the server is
#started from. This is the same rule as the lookup of this config file itself.
#An absolute path (X:\..., /var/...) is used as written. The directory is created on
#startup if it does not exist yet.
#logfilename: base name of the log file. The server appends timestamp, pid and ".log".
logfiledir=logs/
logfilename=imgserver

#filetokenkey: HMAC key for verifying upload/download tokens; must match chatserver.conf
filetokenkey=flamingo-file-token-secret
#relaytokenkey: HMAC key for verifying remote-desktop relay tokens; must match chatserver.conf
relaytokenkey=flamingo-relay-token-secret
#relaylistenip/relaylistenport: remote-desktop relay channel listener (independent from the image port above)
relaylistenip=0.0.0.0
relaylistenport=20003