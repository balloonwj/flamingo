#客户端监听地址与端口
listenip=0.0.0.0
listenport=20002

#头像与图片消息的落盘目录
imgcachedir=./imgcache/

#logfiledir：日志文件所在目录。相对路径按 imgserver 可执行文件所在目录解析，
#不是按进程的工作目录，所以无论从哪里启动，日志都落在同一处。
#这条规则与本配置文件自身的查找规则一致。
#绝对路径（X:\...、/var/...）原样使用。目录不存在时启动阶段会自动创建。
#logfilename：日志文件的基名，服务端会在其后追加时间戳、进程号与 ".log"。
logfiledir=logs/
logfilename=imgserver

#filetokenkey：校验上传 / 下载令牌的 HMAC 密钥，须与 chatserver.conf 一致
filetokenkey=flamingo-file-token-secret
#relaytokenkey：校验远程桌面中转令牌的 HMAC 密钥，须与 chatserver.conf 一致
relaytokenkey=flamingo-relay-token-secret
#relaylistenip / relaylistenport：远程桌面中转通道的监听地址与端口，
#与上面那个图片端口相互独立
relaylistenip=0.0.0.0
relaylistenport=20003

#网络 I/O 工作线程数
#本服务的两个监听端口各配一项，单位：条线程。服务把这个数交给 TcpServer，由它建出同样
#条数的 I/O 工作线程，该端口上所有连接的收发都摊在这些线程上。两项相互独立。
#都可以整项省略，省略时按下面各项注释里写的默认值运行 —— 默认值就是本组配置项引入之前
#写死在代码里的那两个数，所以老配置文件不改也能启动，且行为完全不变。
#取值必须是 1 到 256 之间的十进制整数。取值非法时一律回落到默认值并在日志里记一条
#告警，告警里同时写出配置的值与实际采用的值。非法包括：整项缺失、不是十进制整数
#（如 abc、4x、1.5）、0、负数、以及大于 256。
#注意是回落到默认值而不是截断到边界 —— 截断之后实际生效的线程数与这里写的对不上，
#而排查问题的人手上往往只有这个文件，据此会得出错误的结论。
#上界取 256 的依据：Windows 上事件循环用的是 select，每条线程最多盯 64 条连接，
#线程数超过几十条之后再往上加已无实际意义；定这个上界主要是挡住「把端口号或字节数
#误填进线程数」这类笔误，那类值动辄上万，真按它建线程会让服务在启动阶段就耗光资源。
#iothreadnum：图片端口（上面的 listenport）所用的线程数，默认 6。
#注意 imgserver 与 fileserver 共用同一份服务端代码，但线程数各读各的配置文件，
#这里配的只管 imgserver，fileserver 要在它自己的 fileserver.conf 里另配一份。
iothreadnum=6
#relayiothreadnum：远程桌面 / 音视频中转端口（relaylistenport）所用的线程数，默认 4。
#中转连接数远少于图片传输，故默认值比上面那项小
relayiothreadnum=4
#screenshareviewerbufferbytes：屏幕共享中转里每个观看者的积压上限，单位字节，默认 4194304（4 MiB，2026-10-15 起；之前为 1 MiB）。
#发给某个观看者的数据在服务端积压超过这个值时，暂停发给他视频非关键帧，直到下一个关键帧，
#并向画面的发送者请求关键帧；音频、标注不受影响。缺失或不大于 0 时用默认值
screenshareviewerbufferbytes=4194304

#云端录制（屏幕共享的服务器录制，见 docs/屏幕共享与录制方案.md 12.6）
#cloudrecorddir：录像目录，保存录制中的原始帧文件（rec_<id>.frec）与客户端合成后上传的 MP4（rec_<id>.mp4）。
#相对路径按可执行文件所在目录解析（与 logfiledir 相同），不存在时自动创建；缺失时为 cloudrecords。
#目录建不起来时只关闭云端录制并记日志，其它服务照常
cloudrecorddir=cloudrecords
#cloudrecordminfreemb：录像目录所在磁盘的剩余空间下限，单位 MB，默认 2048。低于它时不能开始录制，
#录制中低于它时自动停止并保存已录部分
cloudrecordminfreemb=2048

#协议加密
#encryption：1 = 三帧握手之后每个帧体都加密（默认），0 = 明文。
#这一项缺失时按 1 处理：安全开关必须往安全的方向失败，
#否则少写一行就把链路悄悄降成了明文。
#serverkeyfile：长期 Ed25519 身份密钥种子文件的路径。相对路径按
#「本配置文件所在的目录」解析（通常就是 etc/），这与 logfiledir 的规则不同 ——
#后者按可执行文件所在目录解析。这里的差异是有意为之：三个服务读的是同一个 etc/
#目录下的 .conf，按这条规则它们天然就落在同一个密钥文件上，不需要额外约定。
#该文件在首次启动时自动创建，同时在旁边生成 <serverkeyfile>.pub，里面是 base64 编码的
#公钥。把这个公钥填进客户端的 config/flamingo.ini 的 serverpubkey 项。
#三个服务（chatserver / fileserver / imgserver）必须指向同一个文件，
#否则客户端要为每个服务各配一把公钥。
#安全提醒：种子文件是服务端的私有身份，不要提交进版本库，权限只给服务账号。
#删掉它会让服务端在下次启动时生成新的身份，届时所有客户端都得换用新公钥。
#另外注意：本解析器只认 '#' 作注释（见 base/ConfigFileReader.cpp），
#以 ';' 开头的行并不是注释，只是因为它不含 '=' 才碰巧被跳过。
encryption=1
serverkeyfile=server_key

#P2P 地址探测（docs/P2P通信方案.md 6.2，客户端之间的点对点直连用来得到自己在 NAT 外的映射地址）
#两个 UDP 端口应答兼容 RFC 5389 的 Binding 请求；只应答不短于 32 字节的请求，应答不大于请求，不会被用来放大流量。
#p2pprobelistenip：监听地址，缺失时为 0.0.0.0。
#p2pprobeport1 / p2pprobeport2：两个 UDP 端口，须与 chatserver.conf 的同名项一致；配成 0 表示不开这个端口。
#服务器在 NAT 或云厂商的安全组后面时，这两个 UDP 端口要放行（并做端口转发）。
#p2pprobeperipps：每个来源 IP 每秒最多应答的请求数，缺失或非法时为 200；同一公司出口 IP 后面的用户共用这个额度。
p2pprobeport1=20004
p2pprobeport2=20005
p2pprobeperipps=200
